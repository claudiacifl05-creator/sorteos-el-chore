<script>
let contenedor = document.getElementById("numeros");
let vendidos = ["0001"];
let apartados = ["0002"];
for(let i = 1; i <= 2500; i++){

let numero = i.toString().padStart(4,"0");

let caja = document.createElement("div");
caja.style.textAlign = "center";

let boton = document.createElement("a");

boton.innerHTML = numero;
boton.href = "https://mpago.la/1nG11oc";
boton.target = "_blank";

if(vendidos.includes(numero)){
    boton.style.background = "red";
}
else if(apartados.includes(numero)){
    boton.style.background = "#ffff00";
}
else{
    boton.style.background = "#00ff00";
}
boton.style.color = "black";
boton.style.padding = "8px";
boton.style.borderRadius = "8px";
boton.style.textDecoration = "none";
boton.style.fontWeight = "bold";
boton.style.display = "inline-block";


let comprobante = document.createElement("a");

let mensaje = "Hola, ya realicé el pago. Quiero confirmar el número " + numero + " de la rifa Silverado 1500 2019.";

comprobante.href = "https://wa.me/5216563605771?text=" + encodeURIComponent(mensaje);
comprobante.innerHTML = "📲 Comprobante";

comprobante.style.display = "block";
comprobante.style.marginTop = "5px";
comprobante.style.background = "#25D366";
comprobante.style.color = "white";
comprobante.style.padding = "5px";
comprobante.style.borderRadius = "8px";
comprobante.style.textDecoration = "none";
comprobante.style.fontSize = "12px";


caja.appendChild(boton);
caja.appendChild(comprobante);

contenedor.appendChild(caja);

}
</script>
