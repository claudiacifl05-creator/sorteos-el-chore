<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos El Chore</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#111;
            color:#fff;
            font-family:Arial,Helvetica,sans-serif;
        }

        .contenedor{
            max-width:700px;
            margin:auto;
            padding:20px;
        }

        h1{
            color:#FFD700;
            text-align:center;
            margin-bottom:20px;
        }

        img{
            width:100%;
            border-radius:15px;
            display:block;
        }

        .info{
            background:#1d1d1d;
            margin-top:20px;
            padding:20px;
            border-radius:15px;
            text-align:center;
        }

        .info p{
            margin:10px 0;
        }

        .leyenda{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
            margin-top:20px;
        }

        .leyenda div{
            padding:10px;
            border-radius:10px;
            text-align:center;
            font-weight:bold;
        }

        .verde{background:#00c853;color:#000;}
        .amarillo{background:#ffd600;color:#000;}
        .rojo{background:#d50000;}
        .morado{background:#7b1fa2;}

        h2{
            text-align:center;
            margin-top:30px;
        }

        #numeros{
            margin-top:20px;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:8px;
        }
          .numero{
    width:60px;
    height:40px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    background:#00c853;
    color:#000;
    transition:0.2s;
}

.numero:hover{
    transform:scale(1.05);
}
    </style>
</head>

<body>

<div class="contenedor">

    <h1>🚗 Sorteos El Chore 🚗</h1>

    <img src="silverado2026.jpg" alt="Silverado 1500 2019">

    <div class="info">

        <h2>Gran Rifa Chevrolet Silverado 1500 2019</h2>

        <p>💰 <strong>Boleto: $350 pesos</strong></p>

        <p>🎟️ 2,500 boletos disponibles</p>

        <p>🍀 4 oportunidades por boleto</p>

        <p>📍 Ciudad Juárez</p>

        <p><strong>Sujeto al 60% de venta.</strong></p>

    </div>

    <div class="leyenda">

        <div class="verde">🟢 Disponible</div>
        <div class="amarillo">🟡 Apartado</div>
        <div class="rojo">🔴 Vendido</div>
        <div class="morado">🟣 Oportunidad extra</div>

    </div>

    <h2>🎟️ Elige tu número</h2>

    <div id="numeros"></div>

</div>
  <script>

const contenedor = document.getElementById("numeros");

for(let i = 1; i <= 2500; i++){

    const boton = document.createElement("button");

    boton.className = "numero";

    boton.textContent = i.toString().padStart(4,"0");

    contenedor.appendChild(boton);

}

</script>

</body>
</html>
